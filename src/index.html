<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Sabores · Ruta de Tapas Castellón</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#b4441b" />
    <!-- Installable app (manifest for Android and Chrome; the Apple tags, for iPhone). -->
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sabores" />
    <meta name="application-name" content="Sabores" />
    <!-- The chosen theme (theme.ts), before painting anything, to avoid a flash of the other one. -->
    <script>
      try {
        const theme = localStorage.getItem('tapas-route:theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <!-- The data, along with the JS, without waiting for the app to start (loadRouteData in app.ts).
         Not with <link rel="preload">: Safari doesn't reuse it and downloads them twice. -->
    <script>
      window.routeData = fetch('data/venues.json');
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
